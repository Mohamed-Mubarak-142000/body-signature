<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eee0c8"/>
      <stop offset="1" stop-color="#f1e9dc"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.3" cy="0.3" r="0.4">
      <stop offset="0" stop-color="#c48a3e" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#c48a3e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.75" cy="0.7" r="0.4">
      <stop offset="0" stop-color="#e7bb7e" stop-opacity="0.65"/>
