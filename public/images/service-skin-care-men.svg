<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8ecda"/>
      <stop offset="1" stop-color="#eee0c8"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.6" r="0.55">
      <stop offset="0" stop-color="#f3c280" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#f3c280" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="45"/>
    </filter>
  </defs>
  <rect width="1200" height="1500" fill="url(#bg)"/>
  <circle cx="600" cy="950" r="380" fill="url(#glow)" filter="url(#soft)"/>
  <g stroke="#82581f" stroke-opacity="0.28" stroke-width="1.6" fill="none">
    <path d="M 300 400 L 900 400"/>
    <path d="M 300 500 L 800 500"/>
    <path d="M 300 600 L 700 600"/>
  </g>
</svg>
