<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8ecda"/>
      <stop offset="1" stop-color="#eee0c8"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.15" r="0.55">
      <stop offset="0" stop-color="#f3c280" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#f3c280" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="45"/>
