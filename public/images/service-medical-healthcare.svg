  </defs>
  <rect width="1200" height="1500" fill="url(#bg)"/>
  <circle cx="600" cy="260" r="360" fill="url(#glow)" filter="url(#soft)"/>
  <g stroke="#82581f" stroke-opacity="0.25" stroke-width="1.5" fill="none">
    <path d="M 100 700 L 1100 700"/>
    <path d="M 100 780 L 1100 780"/>
