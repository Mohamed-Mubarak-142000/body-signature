<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbf8f3"/>
      <stop offset="1" stop-color="#f1e4cd"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.6" cy="0.55" r="0.6">
      <stop offset="0" stop-color="#f3c280" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#f3c280" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="40"/>
    </filter>
  </defs>
  <rect width="1200" height="1500" fill="url(#bg)"/>
  <circle cx="600" cy="700" r="420" fill="url(#glow)" filter="url(#soft)"/>
  <g stroke="#a6702c" stroke-opacity="0.3" stroke-width="1.5" fill="none">
    <circle cx="600" cy="700" r="120"/>
    <circle cx="600" cy="700" r="200"/>
    <circle cx="600" cy="700" r="280"/>
    <circle cx="600" cy="700" r="360"/>
  </g>
</svg>
