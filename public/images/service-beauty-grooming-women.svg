<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8ecda"/>
      <stop offset="1" stop-color="#fbf8f3"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.25" cy="0.25" r="0.45">
      <stop offset="0" stop-color="#f3c280" stop-opacity="0.75"/>
