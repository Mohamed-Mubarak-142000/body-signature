<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbf8f3"/>
      <stop offset="1" stop-color="#f1e9dc"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.25" cy="0.7" r="0.5">
      <stop offset="0" stop-color="#f3c280" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#f3c280" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="45"/>
    </filter>
  </defs>
  <rect width="1200" height="1500" fill="url(#bg)"/>
  <circle cx="300" cy="1050" r="360" fill="url(#glow)" filter="url(#soft)"/>
  <g stroke="#c48a3e" stroke-opacity="0.3" stroke-width="1.6" fill="none">
    <circle cx="600" cy="600" r="120"/>
    <circle cx="600" cy="600" r="220"/>
    <circle cx="600" cy="600" r="320"/>
  </g>
</svg>
