<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8ecda"/>
      <stop offset="1" stop-color="#fbf8f3"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.3" cy="0.3" r="0.45">
      <stop offset="0" stop-color="#f3c280" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#f3c280" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.75" cy="0.75" r="0.45">
      <stop offset="0" stop-color="#e7bb7e" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#e7bb7e" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="45"/>
    </filter>
  </defs>
  <rect width="1200" height="1500" fill="url(#bg)"/>
  <circle cx="360" cy="450" r="340" fill="url(#glowA)" filter="url(#soft)"/>
  <circle cx="900" cy="1050" r="340" fill="url(#glowB)" filter="url(#soft)"/>
  <g stroke="#c48a3e" stroke-opacity="0.3" stroke-width="1.5" fill="none">
    <path d="M 200 750 C 500 650, 700 850, 1000 750"/>
    <path d="M 200 850 C 500 950, 700 750, 1000 850"/>
  </g>
</svg>
